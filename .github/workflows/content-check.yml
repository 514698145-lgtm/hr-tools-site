name: Content checks (no deployment)
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_content.py
      - run: python scripts/check_release.py --audit
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python scripts/build_watch_manifest.py --check
      - run: node --test tests/*.test.mjs
      - run: node tests/backup-rehearsal.mjs
      - run: python scripts/build.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_site.py
      - run: python scripts/package_release.py --candidate
      - uses: actions/upload-artifact@v4
        with:
          name: static-site-and-checks
          path: |
            reports/seo-report.json
            reports/site-check.json
            outputs/releases/*-candidate.zip
      # No deploy, search notification or scheduled trigger before page approval.
